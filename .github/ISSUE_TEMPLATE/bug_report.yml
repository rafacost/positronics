name: Bug report
description: Something broke, crashed, or a quest can't be finished.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Positronics. One problem per report, please.
        Crashes: attach the crash report from `crash-reports/`. Everything else: attach the two logs below.
  - type: input
    id: version
    attributes:
      label: Pack version
      description: Shown on the main menu, under the buttons.
      placeholder: 0.1.2-beta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The Waste Lands (start)
        - River Crossing (ULV)
        - The Calla (LV)
        - Lud (MV)
        - The Cradle (HV)
        - The Dogan (EV)
        - Fedic (IV)
        - End-World I (LuV)
        - End-World II (ZPM)
        - The Beams (UV)
        - The Doors (UHV)
        - A side chapter (Field Manual, Apiary, Logistics, Kitchen, Periodic Table, Simulation Lab, Space, Shop, ...)
        - Crash or won't start
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Quest names or memo numbers help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag in `logs/latest.log` and `logs/kubejs/server.log` from your game folder (or the crash report).
    validations:
      required: true
  - type: dropdown
    id: launcher
    attributes:
      label: Installed with
      options:
        - CurseForge app
        - Prism Launcher
        - Other launcher
    validations:
      required: true
  - type: checkboxes
    id: clean
    attributes:
      label: Setup
      options:
        - label: Single player, no mods added or removed.
