
#Powered generator tier 5 defaults.
[tier5]
	#Range: > 0
	feBuffer = 6553600
	#Range: > 0
	maxFeInputPerTick = 131072
	autoPush = true
	#Range: 1 ~ 64
	itemsPerCycle = 16
	#Range: 1 ~ 54
	outputSlots = 27
	#Range: 1 ~ 2000
	ticksPerCycle = 5
	#Range: > 0
	fePerTick = 32768

#General Settings
[general]
	#Clay, Glowstone, Quartz, Redstone and Snow Generators will generate dust items, not blocks.
	generate_dust = false
	#Pause generators while they receive a redstone signal.
	redstoneDisables = true
	#Enable the Ore Generator.
	oreGeneratorEnable = true
	#Ticks between each tier 1 generation cycle. Kept for compatibility with existing configs.
	#Range: 1 ~ 2000
	blocks_per_tick = 40
	#Enable the Dye Generator.
	dyeGeneratorEnable = true

